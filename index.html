<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dishdale</title>
<meta name="description" content="Dishdale — a family meal planner.">
<style>
:root { --ink: #1c1b22; --ink2: #5b5968; --ground: #ffffff; --line: #e6e4ee; --accent: #6b2d6b; --pending: #9a3412; --pending-ground: #fff4e5; }
@media (prefers-color-scheme: dark) {
  :root { --ink: #f2f1f6; --ink2: #b7b4c4; --ground: #16151b; --line: #2d2b36; --accent: #e2a6e2; --pending: #fdba74; --pending-ground: #3a2413; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
main { max-width: 44rem; margin: 0 auto; padding: 32px 16px 64px; }
nav { font-size: 15px; margin-bottom: 24px; }
nav a { margin-right: 16px; }
h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; }
h2 { font-size: 21px; margin: 36px 0 8px; }
h3 { font-size: 18px; margin: 24px 0 8px; }
p, li { color: var(--ink); }
ul { padding-left: 22px; }
li { margin: 4px 0; }
a { color: var(--accent); }
code { font-size: 0.9em; }
.table { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15px; margin: 12px 0; }
th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
.pending { background: var(--pending-ground); color: var(--pending); padding: 0 4px; border-radius: 4px; font-weight: 600; }
footer { margin-top: 48px; color: var(--ink2); font-size: 14px; }
</style>
</head>
<body>
<main>
<nav><a href="./">Dishdale</a><a href="./privacy/">Privacy Policy</a><a href="./terms/">Terms of Use</a></nav>
<h1>Dishdale</h1>
<p>A family meal planner: a week of meals around your budget, your store and your food rules, and the grocery list to go with it.</p>
<ul><li><a href="privacy/">Privacy Policy</a></li><li><a href="terms/">Terms of Use</a></li></ul>
<footer>Dishdale</footer>
</main>
</body>
</html>
